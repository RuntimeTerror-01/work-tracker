<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Days Tracker</title>
    <style>
        /* External fonts fall back cleanly to system sans-serif if offline */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #05050a; /* Cyberpunk deep void black */
            color: #00f0ff; /* Neon Cyan */
            font-family: 'Orbitron', 'Share Tech Mono', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px;
        }
        
        /* Dashboard & Setup Wrappers */
        #setup-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 400px;
            margin-top: 5vh;
        }

        #main-dashboard {
            display: none; /* Hidden until configured */
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* Setup Form Styles */
        .setup-card {
            background-color: rgba(9, 9, 11, 0.9);
            padding: 32px 24px;
            border-radius: 16px;
            border: 1px solid rgba(217, 70, 239, 0.4); /* Magenta tint */
            box-shadow: 0 0 25px rgba(217, 70, 239, 0.15);
            width: 100%;
        }

        .setup-title {
            text-align: center;
            font-size: 1.5rem;
            color: #d946ef;
            margin-bottom: 24px;
            filter: drop-shadow(0 0 8px rgba(255, 0, 85, 0.3));
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #a1a1aa;
            margin-bottom: 8px;
            font-family: 'Share Tech Mono', monospace;
        }

        .input-field {
            background-color: #0d0e15;
            border: 1px solid #27272a;
            color: #22d3ee;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-field:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        /* Specifically styling date picker icons for dark mode */
        ::-webkit-calendar-picker-indicator {
            filter: invert(1) hue-rotate(180deg) brightness(1.5);
            cursor: pointer;
        }

        .btn-neon {
            width: 100%;
            background: linear-gradient(90deg, #d946ef, #ff0055);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-neon:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
        }

        /* Dashboard Container Card */
        .dashboard-header {
            text-align: center;
            margin-bottom: 32px;
            width: 100%;
            max-width: 672px; /* Equates to max-w-2xl */
            background-color: rgba(9, 9, 11, 0.8); /* bg-zinc-950/80 */
            padding: 24px;
            border-radius: 16px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
            position: relative;
        }

        /* Updated configuration button: Only a gear icon, shifted elegantly right */
        .edit-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            background: none;
            border: 1px solid #27272a;
            color: #71717a;
            font-size: 1rem;
            padding: 6px;
            border-radius: 50%;
            cursor: pointer;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .edit-btn:hover {
            color: #d946ef;
            border-color: #d946ef;
            box-shadow: 0 0 8px rgba(217, 70, 239, 0.4);
            transform: rotate(45deg);
        }

        .dashboard-title {
            font-size: 1.875rem;
            font-weight: 900;
            color: #22d3ee;
            margin-bottom: 24px;
            letter-spacing: 0.05em;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.3));
        }

        .stats-row {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
        }

        .stat-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .stat-col.center-divider {
            padding: 0 16px;
            border-left: 1px solid #27272a;
            border-right: 1px solid #27272a;
        }

        /* Stat Numbers and Glows */
        .num-large {
            font-size: 2.25rem;
            font-weight: 800;
        }
        #count-passed {
            color: #22d3ee;
            filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.5));
        }
        #today-progress {
            font-size: 1.5rem;
            font-weight: 700;
            color: #d946ef;
            filter: drop-shadow(0 0 8px rgba(255, 0, 85, 0.5));
        }
        #count-left {
            color: #52525b;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.05));
        }

        /* Label details */
        .label-main {
            font-size: 0.875rem;
            color: #71717a;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }
        .label-sub {
            font-size: 0.75rem;
            color: #71717a;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        #current-date-display {
            font-size: 0.75rem;
            color: #22d3ee;
            filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.5));
            margin-top: 4px;
        }

        .contract-info {
            margin-top: 24px;
            font-size: 0.875rem;
            color: #71717a;
            font-weight: 500;
        }
        .text-cyan { color: #22d3ee; }
        .text-fuchsia { color: #e879f9; }

        /* Progress Bar Module Styles */
        .progress-container {
            width: 100%;
            max-width: 672px;
            margin-bottom: 32px;
            padding: 0 4px;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #71717a;
            margin-bottom: 8px;
            font-family: 'Share Tech Mono', monospace;
        }

        #overall-progress-text {
            color: #22d3ee;
            font-weight: 700;
            filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.4));
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background-color: rgba(39, 39, 42, 0.6);
            border-radius: 9999px;
            border: 1px solid rgba(0, 240, 255, 0.15);
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #22d3ee, #d946ef);
            border-radius: 9999px;
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.4);
            transition: width 0.4s ease-out;
        }

        /* Matrix Section Header Layout Styling */
        .matrix-header {
            width: 100%;
            max-width: 672px;
            margin: 8px auto 12px auto;
            padding: 0 4px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
            padding-bottom: 8px;
        }

        .matrix-title {
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #22d3ee;
            filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.4));
        }

        /* The container for all our day tubes */
        .tubes-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            max-width: 900px;
            margin: 0 auto;
            padding: 4px 1rem 1rem 1rem;
        }

        /* Base styles for a moderately small vertical oval tube */
        .tube {
            width: 14px;
            height: 38px;
            border-radius: 9999px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .tube-passed {
            background-color: #00f0ff;
            border: 1px solid #00c8ff;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
        }

        .tube-left {
            background-color: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.4);
        }

        .tube-current {
            background-color: rgba(255, 0, 85, 0.1);
            border: 1px solid #ff0055;
            box-shadow: 0 0 14px rgba(255, 0, 85, 0.8);
        }

        .tube-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #ff0055;
            border-radius: 9999px;
            transition: height 1s linear;
        }

        .tube-passed .tube-fill {
            background-color: #00f0ff;
        }

        [data-title]:hover::after {
            content: attr(data-title);
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background: #0d0e15;
            color: #ff0055;
            padding: 4px 8px;
            border-radius: 2px;
            font-size: 11px;
            font-family: 'Share Tech Mono', monospace;
            white-space: nowrap;
            z-index: 10;
            border: 1px solid #00f0ff;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
            pointer-events: none;
        }

        /* Earnings Section Styles */
        .earnings-container {
            width: 100%;
            max-width: 672px;
            margin: 24px auto 0 auto;
            background-color: rgba(9, 9, 11, 0.8);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .earnings-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .earning-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 120px;
        }

        .earning-label {
            font-size: 0.75rem;
            color: #71717a;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .earning-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: #22d3ee;
            font-family: 'Share Tech Mono', monospace;
            filter: drop-shadow(0 0 5px rgba(0, 240, 255, 0.3));
        }

        .earning-value.text-fuchsia {
            color: #e879f9;
            filter: drop-shadow(0 0 5px rgba(232, 121, 249, 0.3));
        }

        /* Pop-up Box / Modal Overlay Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(5, 5, 10, 0.8);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background-color: rgba(9, 9, 11, 0.95);
            border: 2px solid #22d3ee;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
            border-radius: 16px;
            padding: 32px 24px;
            width: 90%;
            max-width: 340px;
            text-align: center;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-daily-rate {
            position: absolute;
            top: 14px;
            left: 16px;
            color: #22d3ee;
            font-size: 0.875rem;
            font-family: 'Share Tech Mono', monospace;
            font-weight: 700;
            opacity: 0.8;
        }

        .modal-close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: #52525b;
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
            font-family: sans-serif;
        }

        .modal-close-btn:hover {
            color: #ff0055;
        }

        .modal-date {
            font-size: 2rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: 0.02em;
        }

        .modal-day {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.125rem;
            color: #a1a1aa;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 18px;
        }

        .modal-status-badge {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 4px 12px;
            border-radius: 9999px;
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div class="setup-card">
            <h1 class="setup-title">Initialize Matrix</h1>
            <form id="setup-form">
                <div class="input-group">
                    <label for="input-start-date">Contract Start Date</label>
                    <input type="date" id="input-start-date" class="input-field" required>
                </div>
                <div class="input-group">
                    <label for="input-end-date">Contract End Date</label>
                    <input type="date" id="input-end-date" class="input-field" required>
                </div>
                <div class="input-group">
                    <label for="input-daily-rate">Daily Rate (Rs.)</label>
                    <input type="number" id="input-daily-rate" class="input-field" placeholder="e.g. 400" min="1" step="any" required>
                </div>
                <button type="submit" class="btn-neon">Start Tracking</button>
            </form>
        </div>
    </div>

    <div id="main-dashboard">
        <div class="dashboard-header">
            <button id="btn-edit-config" class="edit-btn" title="Configuration">⚙️</button>
            <h1 class="dashboard-title">Work Days Tracker</h1>
            
            <div class="stats-row">
                <div class="stat-col">
                    <span class="num-large" id="count-passed">0</span>
                    <span class="label-main">Days Passed</span>
                </div>

                <div class="stat-col center-divider">
                    <span id="today-progress">0%</span>
                    <span class="label-sub">Today's Progress</span>
                    <span id="current-date-display">...</span>
                </div>

                <div class="stat-col">
                    <span class="num-large" id="count-left">0</span>
                    <span class="label-main">Days Left</span>
                </div>
            </div>
            
            <div class="contract-info">
                Contract: <span id="contract-start-display" class="text-cyan">--</span> to <span id="contract-end-display" class="text-cyan">--</span> (<span id="total-days" class="text-fuchsia">0</span> Days)
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-labels">
                <span>Overall Contract Progress</span>
                <span id="overall-progress-text">0.00%</span>
            </div>
            <div class="progress-track">
                <div id="overall-progress-bar" class="progress-fill"></div>
            </div>
        </div>

        <div class="matrix-header">
            <h2 class="matrix-title">Contract Countdown Matrix</h2>
        </div>

        <div id="tubes-container" class="tubes-grid">
        </div>

        <div class="earnings-container">
            <div class="earnings-row">
                <div class="earning-item">
                    <span class="earning-label">Total to Earn</span>
                    <span class="earning-value" id="total-cash">Rs. 0</span>
                </div>
                <div class="earning-item">
                    <span class="earning-label">Earned Till Today</span>
                    <span class="earning-value text-fuchsia" id="earned-cash">Rs. 0.00</span>
                </div>
                <div class="earning-item">
                    <span class="earning-label">Left to Earn</span>
                    <span class="earning-value" id="left-cash">Rs. 0.00</span>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-overlay" class="modal-overlay">
        <div id="modal-box" class="modal-box">
            <span id="modal-daily-rate" class="modal-daily-rate">--</span>
            <button id="modal-close" class="modal-close-btn">&times;</button>
            <div id="modal-date" class="modal-date">--- --</div>
            <div id="modal-day" class="modal-day">---------</div>
            <div id="modal-status" class="modal-status-badge">Unknown</div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Global State Variables
            let startDate, endDate, dailyRate;
            let dates = [];
            let dashboardInterval = null;

            // DOM Elements
            const setupScreen = document.getElementById('setup-screen');
            const mainDashboard = document.getElementById('main-dashboard');
            const setupForm = document.getElementById('setup-form');
            const editBtn = document.getElementById('btn-edit-config');
            const container = document.getElementById('tubes-container');

            // Modal Setup
            const modalOverlay = document.getElementById('modal-overlay');
            const modalBox = document.getElementById('modal-box');
            const modalClose = document.getElementById('modal-close');
            
            const closeModal = () => modalOverlay.classList.remove('active');
            modalClose.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });

            // Date Formatter helper
            const formatDate = (date) => {
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            };

            // Check Local Storage on Load
            const savedConfig = localStorage.getItem('waiterTrackerConfig');
            if (savedConfig) {
                const config = JSON.parse(savedConfig);
                document.getElementById('input-start-date').value = config.start;
                document.getElementById('input-end-date').value = config.end;
                document.getElementById('input-daily-rate').value = config.rate;
                initializeDashboard(config.start, config.end, config.rate);
            }

            // Handle Setup Form Submission
            setupForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const startStr = document.getElementById('input-start-date').value;
                const endStr = document.getElementById('input-end-date').value;
                const rateVal = parseFloat(document.getElementById('input-daily-rate').value);

                if (new Date(startStr) > new Date(endStr)) {
                    alert("Start date cannot be after end date!");
                    return;
                }

                // Save to local storage
                localStorage.setItem('waiterTrackerConfig', JSON.stringify({
                    start: startStr,
                    end: endStr,
                    rate: rateVal
                }));

                initializeDashboard(startStr, endStr, rateVal);
            });

            // Handle Edit Button
            editBtn.addEventListener('click', () => {
                if(dashboardInterval) clearInterval(dashboardInterval);
                mainDashboard.style.display = 'none';
                setupScreen.style.display = 'flex';
            });

            function initializeDashboard(startStr, endStr, rate) {
                // Parse dates manually to avoid timezone shift issues (ensure local midnight)
                const [sYear, sMonth, sDay] = startStr.split('-');
                startDate = new Date(sYear, sMonth - 1, sDay, 0, 0, 0);
                
                const [eYear, eMonth, eDay] = endStr.split('-');
                endDate = new Date(eYear, eMonth - 1, eDay, 23, 59, 59);
                
                dailyRate = rate;

                // Update UI Labels
                document.getElementById('contract-start-display').innerText = formatDate(startDate);
                document.getElementById('contract-end-display').innerText = formatDate(endDate);
                document.getElementById('modal-daily-rate').innerHTML = `&#43; Rs. ${dailyRate.toLocaleString('en-IN')}`;

                // Generate Date Array
                dates = [];
                let d = new Date(startDate);
                while (d <= endDate) {
                    dates.push(new Date(d));
                    d.setDate(d.getDate() + 1);
                }
                document.getElementById('total-days').innerText = dates.length;

                // Clear and build matrix tubes
                container.innerHTML = '';
                dates.forEach((date, index) => {
                    const tube = document.createElement('div');
                    tube.id = `tube-${index}`;
                    tube.className = 'tube tube-left';
                    tube.setAttribute('data-title', formatDate(date));
                    
                    const fill = document.createElement('div');
                    fill.id = `fill-${index}`;
                    fill.className = 'tube-fill';
                    fill.style.height = '0%';
                    
                    tube.appendChild(fill);
                    container.appendChild(tube);

                    tube.addEventListener('click', () => {
                        const fullDateStr = date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                        const weekdayStr = date.toLocaleDateString('en-US', { weekday: 'long' });

                        document.getElementById('modal-date').innerText = fullDateStr;
                        document.getElementById('modal-day').innerText = weekdayStr;

                        const now = new Date();
                        const startOfDay = new Date(date).setHours(0, 0, 0, 0);
                        const endOfDay = new Date(date).setHours(23, 59, 59, 999);

                        let statusText = "Left";
                        let statusColor = "#52525b";

                        if (now > endOfDay) {
                            statusText = "Passed";
                            statusColor = "#22d3ee";
                        } else if (now >= startOfDay && now <= endOfDay) {
                            statusText = "Today";
                            statusColor = "#ff0055";
                        }

                        const statusBadge = document.getElementById('modal-status');
                        statusBadge.innerText = statusText;
                        statusBadge.style.color = statusColor;
                        modalBox.style.borderColor = statusColor;
                        modalBox.style.boxShadow = `0 0 25px ${statusColor}40`;
                        
                        modalOverlay.classList.add('active');
                    });
                });

                // Switch screens
                setupScreen.style.display = 'none';
                mainDashboard.style.display = 'flex';

                // Start loop
                if(dashboardInterval) clearInterval(dashboardInterval);
                updateDashboard();
                dashboardInterval = setInterval(updateDashboard, 1000);
            }

            function updateDashboard() {
                const now = new Date();
                let passedCount = 0;
                let leftCount = 0;
                let todayFraction = 0;

                document.getElementById('current-date-display').innerText = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

                // Overall progress
                const totalContractMs = endDate - startDate;
                const currentContractMs = now - startDate;
                let globalPercentage = (currentContractMs / totalContractMs) * 100;
                globalPercentage = Math.max(0, Math.min(100, globalPercentage));
                
                document.getElementById('overall-progress-bar').style.width = `${globalPercentage}%`;
                document.getElementById('overall-progress-text').innerText = `${globalPercentage.toFixed(2)}%`;

                // Update individual tubes
                dates.forEach((date, index) => {
                    const tube = document.getElementById(`tube-${index}`);
                    const fill = document.getElementById(`fill-${index}`);
                    
                    const startOfDay = new Date(date);
                    startOfDay.setHours(0, 0, 0, 0);
                    
                    const endOfDay = new Date(date);
                    endOfDay.setHours(23, 59, 59, 999);

                    if (now > endOfDay) {
                        tube.className = 'tube tube-passed';
                        tube.setAttribute('data-title', `${formatDate(date)} (Passed)`);
                        fill.style.height = '100%';
                        passedCount++;
                    } else if (now < startOfDay) {
                        tube.className = 'tube tube-left';
                        tube.setAttribute('data-title', `${formatDate(date)} (Left)`);
                        fill.style.height = '0%';
                        leftCount++;
                    } else {
                        tube.className = 'tube tube-current';
                        tube.setAttribute('data-title', `${formatDate(date)} (Today)`);
                        
                        const totalDayMs = endOfDay - startOfDay;
                        const passedMs = now - startOfDay;
                        const percentage = (passedMs / totalDayMs) * 100;
                        todayFraction = passedMs / totalDayMs;
                        
                        fill.style.height = `${percentage}%`;
                        document.getElementById('today-progress').innerText = `${percentage.toFixed(1)}%`;
                    }
                });

                document.getElementById('count-passed').innerText = passedCount;
                document.getElementById('count-left').innerText = leftCount;

                // Earnings Logic
                const totalCash = dates.length * dailyRate;
                
                // If contract hasn't started yet, cap fraction at 0. If finished, cap at 1.
                let effectiveFraction = 0;
                if (now >= startDate && now <= endDate) { effectiveFraction = todayFraction; }
                if (now > endDate) { effectiveFraction = 1; }

                const earnedCash = (passedCount + effectiveFraction) * dailyRate;
                const leftCash = totalCash - earnedCash;

                document.getElementById('total-cash').innerText = `Rs. ${totalCash.toLocaleString('en-IN')}`;
                document.getElementById('earned-cash').innerText = `Rs. ${earnedCash.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                document.getElementById('left-cash').innerText = `Rs. ${Math.max(0, leftCash).toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            }
        });
    </script>
</body>
</html>
