<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Days Tracker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #05050a;
            color: #00f0ff;
            font-family: 'Orbitron', 'Share Tech Mono', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px;
        }

        .language-switcher {
            position: fixed;
            top: 14px;
            left: 14px;
            display: flex;
            gap: 4px;
            z-index: 2000;
        }

        .language-btn {
            background-color: rgba(9, 9, 11, 0.9);
            color: #71717a;
            border: 1px solid #27272a;
            padding: 5px 8px;
            border-radius: 5px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .language-btn:hover {
            color: #22d3ee;
            border-color: #22d3ee;
        }

        .language-btn.active {
            color: #22d3ee;
            border-color: #22d3ee;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.25);
        }

        #setup-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 400px;
            margin-top: 5vh;
        }

        #main-dashboard {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .setup-card {
            background-color: rgba(9, 9, 11, 0.9);
            padding: 32px 24px;
            border-radius: 16px;
            border: 1px solid rgba(217, 70, 239, 0.4);
            box-shadow: 0 0 25px rgba(217, 70, 239, 0.15);
            width: 100%;
        }

        .setup-title {
            text-align: center;
            font-size: 1.5rem;
            color: #d946ef;
            margin-bottom: 24px;
            filter: drop-shadow(0 0 8px rgba(255, 0, 85, 0.3));
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #a1a1aa;
            margin-bottom: 8px;
            font-family: 'Share Tech Mono', monospace;
        }

        .input-field {
            background-color: #0d0e15;
            border: 1px solid #27272a;
            color: #22d3ee;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-field:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        ::-webkit-calendar-picker-indicator {
            filter: invert(1) hue-rotate(180deg) brightness(1.5);
            cursor: pointer;
        }

        .btn-neon {
            width: 100%;
            background: linear-gradient(90deg, #d946ef, #ff0055);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-neon:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 32px;
            width: 100%;
            max-width: 672px;
            background-color: rgba(9, 9, 11, 0.8);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
            position: relative;
        }

        .edit-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            background: none;
            border: 1px solid #27272a;
            color: #71717a;
            font-size: 1rem;
            padding: 6px;
            border-radius: 50%;
            cursor: pointer;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .edit-btn:hover {
            color: #d946ef;
            border-color: #d946ef;
            box-shadow: 0 0 8px rgba(217, 70, 239, 0.4);
            transform: rotate(45deg);
        }

        .dashboard-title {
            font-size: 1.875rem;
            font-weight: 900;
            color: #22d3ee;
            margin-bottom: 24px;
            letter-spacing: 0.05em;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.3));
        }

        .stats-row {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
        }

        .stat-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .stat-col.center-divider {
            padding: 0 16px;
            border-left: 1px solid #27272a;
            border-right: 1px solid #27272a;
        }

        .num-large {
            font-size: 2.25rem;
            font-weight: 800;
        }

        #count-passed {
            color: #22d3ee;
            filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.5));
        }

        #today-progress {
            font-size: 1.5rem;
            font-weight: 700;
            color: #d946ef;
            filter: drop-shadow(0 0 8px rgba(255, 0, 85, 0.5));
        }

        #count-left {
            color: #52525b;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.05));
        }

        .label-main {
            font-size: 0.875rem;
            color: #71717a;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .label-sub {
            font-size: 0.75rem;
            color: #71717a;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        #current-date-display {
            font-size: 0.75rem;
            color: #22d3ee;
            filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.5));
            margin-top: 4px;
        }

        .contract-info {
            margin-top: 24px;
            font-size: 0.875rem;
            color: #71717a;
            font-weight: 500;
        }

        .text-cyan {
            color: #22d3ee;
        }

        .text-fuchsia {
            color: #e879f9;
        }

        .progress-container {
            width: 100%;
            max-width: 672px;
            margin-bottom: 32px;
            padding: 0 4px;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #71717a;
            margin-bottom: 8px;
            font-family: 'Share Tech Mono', monospace;
        }

        #overall-progress-text {
            color: #22d3ee;
            font-weight: 700;
            filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.4));
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background-color: rgba(39, 39, 42, 0.6);
            border-radius: 9999px;
            border: 1px solid rgba(0, 240, 255, 0.15);
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #22d3ee, #d946ef);
            border-radius: 9999px;
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.4);
            transition: width 0.4s ease-out;
        }

        .matrix-header {
            width: 100%;
            max-width: 672px;
            margin: 8px auto 12px auto;
            padding: 0 4px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
            padding-bottom: 8px;
        }

        .matrix-title {
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #22d3ee;
            filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.4));
        }

        .tubes-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            max-width: 900px;
            margin: 0 auto;
            padding: 4px 1rem 1rem 1rem;
        }

        .tube {
            width: 14px;
            height: 38px;
            border-radius: 9999px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .tube-passed {
            background-color: #00f0ff;
            border: 1px solid #00c8ff;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
        }

        .tube-left {
            background-color: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.4);
        }

        .tube-current {
            background-color: rgba(255, 0, 85, 0.1);
            border: 1px solid #ff0055;
            box-shadow: 0 0 14px rgba(255, 0, 85, 0.8);
        }

        .tube-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #ff0055;
            border-radius: 9999px;
            transition: height 1s linear;
        }

        .tube-passed .tube-fill {
            background-color: #00f0ff;
        }

        [data-title]:hover::after {
            content: attr(data-title);
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background: #0d0e15;
            color: #ff0055;
            padding: 4px 8px;
            border-radius: 2px;
            font-size: 11px;
            font-family: 'Share Tech Mono', monospace;
            white-space: nowrap;
            z-index: 10;
            border: 1px solid #00f0ff;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
            pointer-events: none;
        }

        .earnings-container {
            width: 100%;
            max-width: 672px;
            margin: 24px auto 0 auto;
            background-color: rgba(9, 9, 11, 0.8);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .earnings-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .earning-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 120px;
        }

        .earning-label {
            font-size: 0.75rem;
            color: #71717a;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .earning-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: #22d3ee;
            font-family: 'Share Tech Mono', monospace;
            filter: drop-shadow(0 0 5px rgba(0, 240, 255, 0.3));
        }

        .earning-value.text-fuchsia {
            color: #e879f9;
            filter: drop-shadow(0 0 5px rgba(232, 121, 249, 0.3));
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(5, 5, 10, 0.8);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background-color: rgba(9, 9, 11, 0.95);
            border: 2px solid #22d3ee;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
            border-radius: 16px;
            padding: 32px 24px;
            width: 90%;
            max-width: 340px;
            text-align: center;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-daily-rate {
            position: absolute;
            top: 14px;
            left: 16px;
            color: #22d3ee;
            font-size: 0.875rem;
            font-family: 'Share Tech Mono', monospace;
            font-weight: 700;
            opacity: 0.8;
        }

        .modal-close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: #52525b;
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
            font-family: sans-serif;
        }

        .modal-close-btn:hover {
            color: #ff0055;
        }

        .modal-date {
            font-size: 2rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: 0.02em;
        }

        .modal-day {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.125rem;
            color: #a1a1aa;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 18px;
        }

        .modal-status-badge {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 4px 12px;
            border-radius: 9999px;
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 480px) {
            body {
                padding: 40px 10px 24px;
            }

            .dashboard-title {
                font-size: 1.45rem;
            }

            .num-large {
                font-size: 1.8rem;
            }

            #today-progress {
                font-size: 1.2rem;
            }

            .stat-col.center-divider {
                padding: 0 8px;
            }

            .label-main {
                font-size: 0.7rem;
            }

            .earnings-container {
                padding: 16px 10px;
            }

            .earning-item {
                min-width: 100px;
            }
        }
    </style>
</head>
<body>

    <div class="language-switcher" aria-label="Language selection">
        <button id="language-en" class="language-btn active" type="button">EN</button>
        <button id="language-ne" class="language-btn" type="button">ने</button>
    </div>

    <div id="setup-screen">
        <div class="setup-card">
            <h1 class="setup-title" data-i18n="initializeTracker">Start Work Tracker</h1>

            <form id="setup-form">
                <div class="input-group">
                    <label for="input-start-date" data-i18n="contractStartDate">Contract Start Date</label>
                    <input type="date" id="input-start-date" class="input-field" required>
                </div>

                <div class="input-group">
                    <label for="input-end-date" data-i18n="contractEndDate">Contract End Date</label>
                    <input type="date" id="input-end-date" class="input-field" required>
                </div>

                <div class="input-group">
                    <label for="input-daily-rate" data-i18n="dailyRate">Daily Rate (Rs.)</label>
                    <input
                        type="number"
                        id="input-daily-rate"
                        class="input-field"
                        placeholder="e.g. 400"
                        min="1"
                        step="any"
                        required
                    >
                </div>

                <button type="submit" class="btn-neon" data-i18n="startTracking">
                    Start Tracking
                </button>
            </form>
        </div>
    </div>

    <div id="main-dashboard">
        <div class="dashboard-header">
            <button
                id="btn-edit-config"
                class="edit-btn"
                title="Configuration"
                aria-label="Edit configuration"
            >⚙️</button>

            <h1 class="dashboard-title" data-i18n="workDaysTracker">
                Work Days Tracker
            </h1>

            <div class="stats-row">
                <div class="stat-col">
                    <span class="num-large" id="count-passed">0</span>
                    <span class="label-main" data-i18n="daysPassed">Days Passed</span>
                </div>

                <div class="stat-col center-divider">
                    <span id="today-progress">0%</span>
                    <span class="label-sub" data-i18n="todaysProgress">Today's Progress</span>
                    <span id="current-date-display">...</span>
                </div>

                <div class="stat-col">
                    <span class="num-large" id="count-left">0</span>
                    <span class="label-main" data-i18n="daysLeft">Days Left</span>
                </div>
            </div>

            <div class="contract-info">
                <span data-i18n="contract">Contract</span>:
                <span id="contract-start-display" class="text-cyan">--</span>
                <span data-i18n="to">to</span>
                <span id="contract-end-display" class="text-cyan">--</span>
                (<span id="total-days" class="text-fuchsia">0</span>
                <span data-i18n="days">Days</span>)
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-labels">
                <span data-i18n="overallContractProgress">Overall Contract Progress</span>
                <span id="overall-progress-text">0.00%</span>
            </div>

            <div class="progress-track">
                <div id="overall-progress-bar" class="progress-fill"></div>
            </div>
        </div>

        <div class="matrix-header">
            <h2 class="matrix-title" data-i18n="contractCountdown">
                Contract Countdown
            </h2>
        </div>

        <div id="tubes-container" class="tubes-grid"></div>

        <div class="earnings-container">
            <div class="earnings-row">
                <div class="earning-item">
                    <span class="earning-label" data-i18n="totalToEarn">Total to Earn</span>
                    <span class="earning-value" id="total-cash">Rs. 0</span>
                </div>

                <div class="earning-item">
                    <span class="earning-label" data-i18n="earnedTillToday">Earned Till Today</span>
                    <span class="earning-value text-fuchsia" id="earned-cash">Rs. 0.00</span>
                </div>

                <div class="earning-item">
                    <span class="earning-label" data-i18n="leftToEarn">Left to Earn</span>
                    <span class="earning-value" id="left-cash">Rs. 0.00</span>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-overlay" class="modal-overlay">
        <div id="modal-box" class="modal-box">
            <span id="modal-daily-rate" class="modal-daily-rate">--</span>

            <button
                id="modal-close"
                class="modal-close-btn"
                type="button"
                aria-label="Close"
            >&times;</button>

            <div id="modal-date" class="modal-date">--- --</div>
            <div id="modal-day" class="modal-day">---------</div>
            <div id="modal-status" class="modal-status-badge">Unknown</div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let startDate;
            let endDate;
            let dailyRate;
            let dates = [];
            let dashboardInterval = null;
            let currentLanguage = localStorage.getItem('workTrackerLanguage') || 'en';

            const translations = {
                en: {
                    initializeTracker: "Start Work Tracker",
                    contractStartDate: "Contract Start Date",
                    contractEndDate: "Contract End Date",
                    dailyRate: "Daily Rate (Rs.)",
                    startTracking: "Start Tracking",
                    workDaysTracker: "Work Days Tracker",
                    daysPassed: "Days Passed",
                    todaysProgress: "Today's Progress",
                    daysLeft: "Days Left",
                    contract: "Contract",
                    to: "to",
                    days: "Days",
                    overallContractProgress: "Overall Contract Progress",
                    contractCountdown: "Contract Countdown",
                    totalToEarn: "Total to Earn",
                    earnedTillToday: "Earned Till Today",
                    leftToEarn: "Left to Earn",
                    configuration: "Configuration",
                    close: "Close",
                    passed: "Passed",
                    left: "Left",
                    today: "Today",
                    invalidDates: "Please enter valid dates.",
                    invalidRate: "Daily rate must be greater than 0.",
                    startAfterEnd: "Start date cannot be after end date."
                },
                ne: {
                    initializeTracker: "काम ट्र्याकर सुरु गर्नुहोस्",
                    contractStartDate: "काम सुरु हुने मिति",
                    contractEndDate: "काम सकिने मिति",
                    dailyRate: "दैनिक पारिश्रमिक (रु.)",
                    startTracking: "ट्र्याकिङ सुरु गर्नुहोस्",
                    workDaysTracker: "कामको दिन ट्र्याकर",
                    daysPassed: "बितेका दिन",
                    todaysProgress: "आजको प्रगति",
                    daysLeft: "बाँकी दिन",
                    contract: "कामको अवधि",
                    to: "देखि",
                    days: "दिन",
                    overallContractProgress: "समग्र कामको प्रगति",
                    contractCountdown: "कामको बाँकी दिन",
                    totalToEarn: "कुल कमाइ",
                    earnedTillToday: "आजसम्मको कमाइ",
                    leftToEarn: "बाँकी कमाइ",
                    configuration: "सेटिङ",
                    close: "बन्द गर्नुहोस्",
                    passed: "बितिसकेको",
                    left: "बाँकी",
                    today: "आज",
                    invalidDates: "कृपया सही मिति राख्नुहोस्।",
                    invalidRate: "दैनिक पारिश्रमिक ० भन्दा बढी हुनुपर्छ।",
                    startAfterEnd: "सुरु हुने मिति सकिने मितिभन्दा पछि हुन सक्दैन।"
                }
            };

            const setupScreen = document.getElementById('setup-screen');
            const mainDashboard = document.getElementById('main-dashboard');
            const setupForm = document.getElementById('setup-form');
            const editBtn = document.getElementById('btn-edit-config');
            const container = document.getElementById('tubes-container');

            const modalOverlay = document.getElementById('modal-overlay');
            const modalBox = document.getElementById('modal-box');
            const modalClose = document.getElementById('modal-close');

            const languageEn = document.getElementById('language-en');
            const languageNe = document.getElementById('language-ne');

            const getText = (key) => {
                return translations[currentLanguage][key] || translations.en[key] || key;
            };

            const updateLanguageButtons = () => {
                languageEn.classList.toggle('active', currentLanguage === 'en');
                languageNe.classList.toggle('active', currentLanguage === 'ne');
            };

            const updateInterfaceLanguage = () => {
                document.documentElement.lang = currentLanguage === 'ne' ? 'ne' : 'en';

                document.querySelectorAll('[data-i18n]').forEach((element) => {
                    const key = element.getAttribute('data-i18n');

                    if (translations[currentLanguage][key]) {
                        element.textContent = translations[currentLanguage][key];
                    }
                });

                editBtn.title = getText('configuration');
                editBtn.setAttribute('aria-label', getText('configuration'));
                modalClose.setAttribute('aria-label', getText('close'));

                updateLanguageButtons();

                if (startDate && endDate && dates.length) {
                    updateDashboard();
                }
            };

            const setLanguage = (language) => {
                if (!translations[language]) {
                    return;
                }

                currentLanguage = language;
                localStorage.setItem('workTrackerLanguage', language);
                updateInterfaceLanguage();
            };

            languageEn.addEventListener('click', () => {
                setLanguage('en');
            });

            languageNe.addEventListener('click', () => {
                setLanguage('ne');
            });

            const closeModal = () => {
                modalOverlay.classList.remove('active');
            };

            modalClose.addEventListener('click', closeModal);

            modalOverlay.addEventListener('click', (event) => {
                if (event.target === modalOverlay) {
                    closeModal();
                }
            });

            const getDateLocale = () => {
                return currentLanguage === 'ne' ? 'ne-NP' : 'en-US';
            };

            const formatDate = (date) => {
                return date.toLocaleDateString(getDateLocale(), {
                    month: 'short',
                    day: 'numeric'
                });
            };

            const formatFullDate = (date) => {
                return date.toLocaleDateString(getDateLocale(), {
                    month: 'long',
                    day: 'numeric',
                    year: 'numeric'
                });
            };

            const formatWeekday = (date) => {
                return date.toLocaleDateString(getDateLocale(), {
                    weekday: 'long'
                });
            };

            const getLocalDate = (dateString, endOfDay = false) => {
                const parts = dateString.split('-').map(Number);

                if (parts.length !== 3 || parts.some(Number.isNaN)) {
                    return null;
                }

                const [year, month, day] = parts;

                return endOfDay
                    ? new Date(year, month - 1, day, 23, 59, 59, 999)
                    : new Date(year, month - 1, day, 0, 0, 0, 0);
            };

            const isValidDateInput = (dateString) => {
                if (!/^\d{4}-\d{2}-\d{2}$/.test(dateString)) {
                    return false;
                }

                const date = getLocalDate(dateString);

                if (!date || Number.isNaN(date.getTime())) {
                    return false;
                }

                const [year, month, day] = dateString.split('-').map(Number);

                return (
                    date.getFullYear() === year &&
                    date.getMonth() === month - 1 &&
                    date.getDate() === day
                );
            };

            const loadSavedConfiguration = () => {
                const savedConfig = localStorage.getItem('waiterTrackerConfig');

                if (!savedConfig) {
                    return;
                }

                try {
                    const config = JSON.parse(savedConfig);

                    if (
                        !config ||
                        typeof config.start !== 'string' ||
                        typeof config.end !== 'string' ||
                        !Number.isFinite(Number(config.rate)) ||
                        Number(config.rate) <= 0 ||
                        !isValidDateInput(config.start) ||
                        !isValidDateInput(config.end)
                    ) {
                        localStorage.removeItem('waiterTrackerConfig');
                        return;
                    }

                    const savedStart = getLocalDate(config.start);
                    const savedEnd = getLocalDate(config.end, true);

                    if (savedStart > savedEnd) {
                        localStorage.removeItem('waiterTrackerConfig');
                        return;
                    }

                    document.getElementById('input-start-date').value = config.start;
                    document.getElementById('input-end-date').value = config.end;
                    document.getElementById('input-daily-rate').value = config.rate;

                    initializeDashboard(
                        config.start,
                        config.end,
                        Number(config.rate)
                    );
                } catch {
                    localStorage.removeItem('waiterTrackerConfig');
                }
            };

            setupForm.addEventListener('submit', (event) => {
                event.preventDefault();

                const startStr = document.getElementById('input-start-date').value;
                const endStr = document.getElementById('input-end-date').value;
                const rateVal = parseFloat(
                    document.getElementById('input-daily-rate').value
                );

                if (!isValidDateInput(startStr) || !isValidDateInput(endStr)) {
                    alert(getText('invalidDates'));
                    return;
                }

                if (!Number.isFinite(rateVal) || rateVal <= 0) {
                    alert(getText('invalidRate'));
                    return;
                }

                const selectedStartDate = getLocalDate(startStr);
                const selectedEndDate = getLocalDate(endStr, true);

                if (selectedStartDate > selectedEndDate) {
                    alert(getText('startAfterEnd'));
                    return;
                }

                localStorage.setItem('waiterTrackerConfig', JSON.stringify({
                    start: startStr,
                    end: endStr,
                    rate: rateVal
                }));

                initializeDashboard(startStr, endStr, rateVal);
            });

            editBtn.addEventListener('click', () => {
                if (dashboardInterval) {
                    clearInterval(dashboardInterval);
                    dashboardInterval = null;
                }

                closeModal();
                mainDashboard.style.display = 'none';
                setupScreen.style.display = 'flex';
            });

            function initializeDashboard(startStr, endStr, rate) {
                const parsedStartDate = getLocalDate(startStr);
                const parsedEndDate = getLocalDate(endStr, true);

                if (
                    !parsedStartDate ||
                    !parsedEndDate ||
                    parsedStartDate > parsedEndDate
                ) {
                    return;
                }

                startDate = parsedStartDate;
                endDate = parsedEndDate;
                dailyRate = Number(rate);

                document.getElementById('contract-start-display').innerText =
                    formatDate(startDate);

                document.getElementById('contract-end-display').innerText =
                    formatDate(endDate);

                document.getElementById('modal-daily-rate').innerHTML =
                    `&#43; Rs. ${dailyRate.toLocaleString(
                        currentLanguage === 'ne' ? 'ne-NP' : 'en-IN'
                    )}`;

                dates = [];
                let currentDate = new Date(startDate);

                while (currentDate <= endDate) {
                    dates.push(new Date(currentDate));
                    currentDate.setDate(currentDate.getDate() + 1);
                }

                document.getElementById('total-days').innerText = dates.length;

                container.innerHTML = '';

                dates.forEach((date, index) => {
                    const tube = document.createElement('div');

                    tube.id = `tube-${index}`;
                    tube.className = 'tube tube-left';
                    tube.setAttribute(
                        'data-title',
                        `${formatDate(date)} (${getText('left')})`
                    );

                    const fill = document.createElement('div');

                    fill.id = `fill-${index}`;
                    fill.className = 'tube-fill';
                    fill.style.height = '0%';

                    tube.appendChild(fill);
                    container.appendChild(tube);

                    tube.addEventListener('click', () => {
                        document.getElementById('modal-date').innerText =
                            formatFullDate(date);

                        document.getElementById('modal-day').innerText =
                            formatWeekday(date);

                        const now = new Date();

                        const startOfDay = new Date(date);
                        startOfDay.setHours(0, 0, 0, 0);

                        const endOfDay = new Date(date);
                        endOfDay.setHours(23, 59, 59, 999);

                        let statusText = getText('left');
                        let statusColor = "#52525b";

                        if (now > endOfDay) {
                            statusText = getText('passed');
                            statusColor = "#22d3ee";
                        } else if (
                            now >= startOfDay &&
                            now <= endOfDay
                        ) {
                            statusText = getText('today');
                            statusColor = "#ff0055";
                        }

                        const statusBadge =
                            document.getElementById('modal-status');

                        statusBadge.innerText = statusText;
                        statusBadge.style.color = statusColor;

                        modalBox.style.borderColor = statusColor;
                        modalBox.style.boxShadow =
                            `0 0 25px ${statusColor}40`;

                        modalOverlay.classList.add('active');
                    });
                });

                setupScreen.style.display = 'none';
                mainDashboard.style.display = 'flex';

                if (dashboardInterval) {
                    clearInterval(dashboardInterval);
                }

                updateDashboard();
                dashboardInterval = setInterval(updateDashboard, 1000);
            }

            function updateDashboard() {
                if (!startDate || !endDate || !dates.length) {
                    return;
                }

                const now = new Date();

                let passedCount = 0;
                let leftCount = 0;
                let todayFraction = 0;
                let todayFound = false;

                document.getElementById('current-date-display').innerText =
                    now.toLocaleDateString(getDateLocale(), {
                        month: 'short',
                        day: 'numeric',
                        year: 'numeric'
                    });

                document.getElementById('modal-daily-rate').innerHTML =
                    `&#43; Rs. ${dailyRate.toLocaleString(
                        currentLanguage === 'ne' ? 'ne-NP' : 'en-IN'
                    )}`;

                const totalContractMs = endDate - startDate;
                const currentContractMs = now - startDate;

                let globalPercentage;

                if (totalContractMs <= 0) {
                    globalPercentage = now >= endDate ? 100 : 0;
                } else {
                    globalPercentage =
                        (currentContractMs / totalContractMs) * 100;

                    globalPercentage = Math.max(
                        0,
                        Math.min(100, globalPercentage)
                    );
                }

                document.getElementById('overall-progress-bar').style.width =
                    `${globalPercentage}%`;

                document.getElementById('overall-progress-text').innerText =
                    `${globalPercentage.toFixed(2)}%`;

                document.getElementById('today-progress').innerText = '0%';

                dates.forEach((date, index) => {
                    const tube =
                        document.getElementById(`tube-${index}`);

                    const fill =
                        document.getElementById(`fill-${index}`);

                    if (!tube || !fill) {
                        return;
                    }

                    const startOfDay = new Date(date);
                    startOfDay.setHours(0, 0, 0, 0);

                    const endOfDay = new Date(date);
                    endOfDay.setHours(23, 59, 59, 999);

                    if (now > endOfDay) {
                        tube.className = 'tube tube-passed';

                        tube.setAttribute(
                            'data-title',
                            `${formatDate(date)} (${getText('passed')})`
                        );

                        fill.style.height = '100%';
                        passedCount++;
                    } else if (now < startOfDay) {
                        tube.className = 'tube tube-left';

                        tube.setAttribute(
                            'data-title',
                            `${formatDate(date)} (${getText('left')})`
                        );

                        fill.style.height = '0%';
                        leftCount++;
                    } else {
                        tube.className = 'tube tube-current';

                        tube.setAttribute(
                            'data-title',
                            `${formatDate(date)} (${getText('today')})`
                        );

                        const totalDayMs = endOfDay - startOfDay;

                        const passedMs = Math.max(
                            0,
                            Math.min(
                                totalDayMs,
                                now - startOfDay
                            )
                        );

                        const percentage =
                            totalDayMs > 0
                                ? (passedMs / totalDayMs) * 100
                                : 100;

                        todayFraction =
                            totalDayMs > 0
                                ? passedMs / totalDayMs
                                : 1;

                        fill.style.height = `${percentage}%`;

                        document.getElementById('today-progress').innerText =
                            `${percentage.toFixed(1)}%`;

                        todayFound = true;
                    }
                });

                if (!todayFound) {
                    document.getElementById('today-progress').innerText =
                        now < startDate ? '0%' : '100%';
                }

                document.getElementById('count-passed').innerText =
                    passedCount;

                document.getElementById('count-left').innerText =
                    leftCount;

                const totalCash = dates.length * dailyRate;

                let effectiveFraction = 0;

                if (now >= startDate && now <= endDate) {
                    effectiveFraction = todayFraction;
                } else if (now > endDate) {
                    effectiveFraction = 1;
                }

                const earnedCash =
                    (passedCount + effectiveFraction) * dailyRate;

                const leftCash = totalCash - earnedCash;

                const numberLocale =
                    currentLanguage === 'ne' ? 'ne-NP' : 'en-IN';

                document.getElementById('total-cash').innerText =
                    `Rs. ${totalCash.toLocaleString(numberLocale)}`;

                document.getElementById('earned-cash').innerText =
                    `Rs. ${earnedCash.toLocaleString(numberLocale, {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    })}`;

                document.getElementById('left-cash').innerText =
                    `Rs. ${Math.max(0, leftCash).toLocaleString(
                        numberLocale,
                        {
                            minimumFractionDigits: 2,
                            maximumFractionDigits: 2
                        }
                    )}`;
            }

            updateInterfaceLanguage();
            loadSavedConfiguration();
        });
    </script>
</body>
</html>
